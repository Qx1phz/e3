<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limit Extremely - Advanced Notes System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
        }

        /* ============ LOGIN PAGE ============ */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #0d0d0d 100%);
        }

        .login-container {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 0, 0.15);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(255, 0, 0, 0.15);
        }

        .login-logo {
            font-size: 28px;
            font-weight: 700;
            color: #ff0000;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 40px;
            letter-spacing: 0.08em;
        }

        .login-container h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .login-form input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .login-form input:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .login-btn:hover {
            box-shadow: 0 15px 30px rgba(255, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* ============ DASHBOARD PAGE ============ */
        .dashboard-page {
            display: none;
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #0d0d0d 100%);
            padding-bottom: 40px;
        }

        .dashboard-header {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            font-size: 18px;
            font-weight: 700;
            color: #ff0000;
            letter-spacing: 0.1em;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-profile:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
        }

        .btn-logout {
            padding: 8px 16px;
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
            border: 1px solid #ff0000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff0000;
            color: white;
        }

        .dashboard-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .welcome-section {
            margin-bottom: 30px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: #888;
            font-size: 15px;
        }

        /* ============ ADD NOTE SECTION ============ */
        .add-note-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .add-note-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 0, 0, 0.3);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .category-select {
            width: 100%;
        }

        .file-upload-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .file-upload-btn:hover {
            border-color: rgba(255, 0, 0, 0.6);
            background-color: rgba(255, 0, 0, 0.05);
            color: #ff0000;
        }

        .file-name {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-add-note {
            padding: 12px;
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add-note:hover {
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .btn-clear {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        /* ============ NOTES LIST ============ */
        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .note-card {
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .note-card:hover {
            background: rgba(30, 30, 30, 0.9);
            border-color: rgba(255, 0, 0, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.1);
        }

        .note-category {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(255, 0, 0, 0.15);
            color: #ff0000;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .note-content {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: #666;
        }

        .note-date {
            flex: 1;
        }

        .note-actions {
            display: flex;
            gap: 8px;
        }

        .note-attachment {
            margin-top: 12px;
            padding: 8px;
            background: rgba(255, 0, 0, 0.08);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #ff0000;
        }

        .btn-delete {
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #ff0000;
            color: white;
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-message-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ============ MODAL ============ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }

        .btn-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .btn-close:hover {
            color: #fff;
        }

        .profile-info {
            margin-bottom: 20px;
        }

        .profile-field {
            margin-bottom: 16px;
        }

        .profile-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .profile-value {
            font-size: 16px;
            color: #fff;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 640px) {
            .login-container {
                border-radius: 20px;
                padding: 30px 20px;
                width: 90%;
            }

            .dashboard-content {
                padding: 16px;
            }

            .notes-container {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                grid-template-columns: 1fr;
            }

            .add-note-card {
                border-radius: 12px;
                padding: 16px;
            }

            .modal-content {
                width: 90%;
                padding: 24px;
                border-radius: 20px;
            }
        }

       /* تعديل كود الصورة لتكون أكبر ولها تأثير توهج أبيض مغبش */
        .banner-img {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 85%; /* تكبير عرض الصورة لتملأ معظم عرض المربع */
            max-width: 250px; /* تحديد أقصى عرض */
            height: auto;
            border-radius: 12px;
            
            /* تأثير التغبش والتوهج */
            filter: brightness(1.2) contrast(1.1); /* زيادة السطوع لتظهر مغبشة/مضيئة */
            box-shadow: 0 0 25px 10px rgba(255, 255, 255, 0.15); /* توهج أبيض ناعم حول الصورة */
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<!-- ============ LOGIN PAGE ============ -->
<div id="loginPage" class="login-page">
    <div class="login-container">
        <!-- ضع كود الصورة هنا -->
        <img src="https://pin.it/2QaVDvioH" alt="Logo" class="banner-img">
        
        
        <div class="login-subtitle">Welcome to Qx1hpz</div>
        <h2>login</h2>
        <form id="loginForm" class="login-form">
            <input type="text" id="username" placeholder="username" required>
            <input type="password" id="password" placeholder="password" required>
            <button type="submit" class="login-btn">login</button>
        </form>
    </div>
</div>

<!-- ============ DASHBOARD PAGE ============ -->
<div id="dashboardPage" class="dashboard-page">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="header-logo">❯❯ LIMIT</div>
        <div class="header-actions">
            <button class="btn-profile" onclick="openProfileModal()" title="البروفايل">👤</button>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>
    </div>

    <!-- Content -->
    <div class="dashboard-content">
        <!-- Welcome Section -->
        <div class="welcome-section">
            <div class="welcome-title">أهلاً بك! 👋</div>
            <div class="welcome-subtitle">أضف ملاحظاتك وتعلمك اليومي هنا</div>
        </div>

        <!-- Add Note Section -->
        <div class="add-note-card">
            <div class="add-note-title">✏️ إضافة ملاحظة جديدة</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">العنوان</label>
                    <input type="text" id="noteTitle" placeholder="عنوان الملاحظة...">
                </div>
                <div class="form-group">
                    <label class="form-label">التصنيف</label>
                    <select id="noteCategory" class="category-select">
                        <option value="برمجة">💻 برمجة</option>
                        <option value="تصميم">🎨 تصميم</option>
                        <option value="مشاريع">📁 مشاريع</option>
                        <option value="تعليم">📚 تعليم</option>
                        <option value="أخرى">⭐ أخرى</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">المحتوى</label>
                <textarea id="noteContent" placeholder="اكتب ملاحظتك هنا..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">إضافة ملف (اختياري)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="fileInput">
                    <button type="button" class="file-upload-btn" onclick="document.getElementById('fileInput').click()">
                        📎 اختر ملف (صورة أو وثيقة)
                    </button>
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-add-note" onclick="addNote()">➕ إضافة الملاحظة</button>
                <button type="button" class="btn-clear" onclick="clearForm()">مسح</button>
            </div>
        </div>

        <!-- Notes List -->
        <div id="notesContainer" class="notes-container">
            <div class="empty-message">
                <div class="empty-message-icon">📝</div>
                <div>لم تضف أي ملاحظات حتى الآن</div>
                <div style="font-size: 12px; margin-top: 8px;">ابدأ بإضافة ملاحظتك الأولى أعلاه</div>
            </div>
        </div>
    </div>
</div>

<!-- ============ PROFILE MODAL ============ -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">البروفايل</div>
            <button class="btn-close" onclick="closeProfileModal()">✕</button>
        </div>
        <div class="profile-info">
            <div class="profile-field">
                <div class="profile-label">اسم المستخدم</div>
                <div class="profile-value" id="profileUsername">admin</div>
            </div>
            <div class="profile-field">
                <div class="profile-label">تاريخ التسجيل</div>
                <div class="profile-value" id="profileDate">-</div>
            </div>
            <div class="profile-field">
                <div class="profile-label">عدد الملاحظات</div>
                <div class="profile-value" id="profileNotesCount">0</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============ CONSTANTS ============
    const STORAGE_KEY = 'limit_notes';
    const USER_KEY = 'limit_user';
    const LOGIN_DATE_KEY = 'limit_login_date';

    // ============ LOGIN LOGIC ============
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // بيانات الدخول الثابتة - لا تغيير!
        if (username === 'admin' && password === '1234') {
            const now = new Date();
            localStorage.setItem(USER_KEY, username);
            localStorage.setItem(LOGIN_DATE_KEY, now.toLocaleString('ar-SA'));
            showDashboard();
        } else {
            alert('بيانات خاطئة! استخدم admin / 1234');
        }
    });

    // ============ PAGE SWITCHING ============
    function showDashboard() {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'block';
        loadNotes();
    }

    function logout() {
        if (confirm('هل تريد تسجيل الخروج؟')) {
            localStorage.removeItem(USER_KEY);
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboardPage').style.display = 'none';
            document.getElementById('loginForm').reset();
        }
    }

    // ============ FILE HANDLING ============
    let selectedFile = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            document.getElementById('fileName').textContent = '✓ تم اختيار: ' + selectedFile.name;
        }
    });

    // ============ NOTE FUNCTIONS ============
    function addNote() {
        const title = document.getElementById('noteTitle').value.trim();
        const content = document.getElementById('noteContent').value.trim();
        const category = document.getElementById('noteCategory').value;

        if (!title || !content) {
            alert('أدخل العنوان والمحتوى على الأقل');
            return;
        }

        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        let fileData = null;
        if (selectedFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                fileData = {
                    name: selectedFile.name,
                    data: e.target.result
                };
                
                const note = {
                    id: Date.now(),
                    title: title,
                    content: content,
                    category: category,
                    file: fileData,
                    date: new Date().toLocaleString('ar-SA')
                };

                notes.push(note);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
                clearForm();
                loadNotes();
            };
            reader.readAsDataURL(selectedFile);
        } else {
            const note = {
                id: Date.now(),
                title: title,
                content: content,
                category: category,
                file: null,
                date: new Date().toLocaleString('ar-SA')
            };

            notes.push(note);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            clearForm();
            loadNotes();
        }
    }

    function loadNotes() {
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const container = document.getElementById('notesContainer');

        container.innerHTML = '';

        if (notes.length === 0) {
            container.innerHTML = `
                <div class="empty-message">
                    <div class="empty-message-icon">📝</div>
                    <div>لم تضف أي ملاحظات حتى الآن</div>
                    <div style="font-size: 12px; margin-top: 8px;">ابدأ بإضافة ملاحظتك الأولى أعلاه</div>
                </div>
            `;
        } else {
            notes.reverse().forEach(note => {
                const noteEl = document.createElement('div');
                noteEl.className = 'note-card';
                
                let attachmentHtml = '';
                if (note.file) {
                    attachmentHtml = `<div class="note-attachment">📎 ${note.file.name}</div>`;
                }

                noteEl.innerHTML = `
                    <div class="note-category">${note.category}</div>
                    <div style="margin-bottom: 8px;">
                        <strong style="font-size: 16px;">${note.title}</strong>
                    </div>
                    <div class="note-content">${note.content.replace(/\n/g, '<br>')}</div>
                    ${attachmentHtml}
                    <div class="note-footer">
                        <div class="note-date">📅 ${note.date}</div>
                        <div class="note-actions">
                            <button class="btn-delete" onclick="deleteNote(${note.id})">حذف</button>
                        </div>
                    </div>
                `;
                container.appendChild(noteEl);
            });
        }

        updateProfileCount();
    }

    function deleteNote(id) {
        if (confirm('هل تريد حذف هذه الملاحظة؟')) {
            let notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            notes = notes.filter(note => note.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            loadNotes();
        }
    }

    function clearForm() {
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        document.getElementById('noteCategory').value = 'برمجة';
        document.getElementById('fileInput').value = '';
        document.getElementById('fileName').textContent = '';
        selectedFile = null;
    }

    // ============ PROFILE MODAL ============
    function openProfileModal() {
        const user = localStorage.getItem(USER_KEY) || 'admin';
        const loginDate = localStorage.getItem(LOGIN_DATE_KEY) || '-';
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        document.getElementById('profileUsername').textContent = user;
        document.getElementById('profileDate').textContent = loginDate;
        document.getElementById('profileNotesCount').textContent = notes.length;

        document.getElementById('profileModal').classList.add('active');
    }

    function closeProfileModal() {
        document.getElementById('profileModal').classList.remove('active');
    }

    function updateProfileCount() {
        const notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        document.getElementById('profileNotesCount').textContent = notes.length;
    }

    // ============ CLOSE MODAL ON CLICK OUTSIDE ============
    window.addEventListener('click', function(e) {
        const modal = document.getElementById('profileModal');
        if (e.target === modal) {
            closeProfileModal();
        }
    });

    // ============ CHECK IF LOGGED IN ============
    window.addEventListener('load', function() {
        const user = localStorage.getItem(USER_KEY);
        if (user) {
            showDashboard();
        }
    });

    // ============ KEYBOARD SHORTCUTS ============
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeProfileModal();
        }
    });
</script>

</body>
</html>
